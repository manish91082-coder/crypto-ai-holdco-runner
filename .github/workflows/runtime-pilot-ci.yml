name: Runtime Pilot CI

on:
  push:
    branches:
      - temporary-zero-cost-runtime-pilot
    paths:
      - 'neon-functions/cryptoaicore/**'
      - '!neon-functions/cryptoaicore/README.md'
      - 'db/migrations/pilot/**'
      - 'db/tests/pilot/**'
      - 'scripts/patch_neon_function_bundle.py'
      - 'tests/**'
      - '.github/workflows/runtime-pilot-ci.yml'
  pull_request:
    branches:
      - temporary-zero-cost-runtime-pilot
    paths:
      - 'neon-functions/cryptoaicore/**'
      - 'db/migrations/pilot/**'
      - 'db/tests/pilot/**'
      - 'scripts/patch_neon_function_bundle.py'
      - 'tests/**'
      - '.github/workflows/runtime-pilot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: node --check src/server.js && node --check src/worker.js && node --check src/pipeline.js && node --check src/model.js
      - name: Verify archived Neon Function bundle integrity
        run: |
          set -euo pipefail
          base64 -d neon-functions/cryptoaicore/function.zip.b64 > /tmp/cryptoaicore.zip
          unzip -p /tmp/cryptoaicore.zip index.mjs > /tmp/cryptoaicore-index.mjs
          expected="$(awk '{print $1}' neon-functions/cryptoaicore/index.mjs.sha256)"
          actual="$(sha256sum /tmp/cryptoaicore-index.mjs | awk '{print $1}')"
          test "$expected" = "$actual"
          node --check /tmp/cryptoaicore-index.mjs
          echo "DEPLOYED_FUNCTION_SHA256=$actual"
          echo "----- DEPLOYED FUNCTION SOURCE BEGIN -----"
          sed -n '1,320p' /tmp/cryptoaicore-index.mjs
          echo "----- DEPLOYED FUNCTION SOURCE END -----"
      - name: Build corrected JSONB-safe Neon Function bundle
        run: |
          set -euo pipefail
          python3 scripts/patch_neon_function_bundle.py neon-functions/cryptoaicore/function.zip.b64 /tmp/cryptoaicore-fixed.zip > /tmp/bundle-build.txt
          unzip -p /tmp/cryptoaicore-fixed.zip index.mjs > /tmp/cryptoaicore-fixed.mjs
          node --check /tmp/cryptoaicore-fixed.mjs
          cat /tmp/bundle-build.txt
      - name: Domain and safety tests
        run: node --test
      - name: Live Neon Function and database smoke test
        env:
          FUNCTION_URL: https://br-lively-flower-a15zb6ar-cryptoaicore.compute.c-1.ap-southeast-1.aws.neon.tech
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$FUNCTION_URL/" -o /tmp/root.json
          cat /tmp/root.json
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('/tmp/root.json','utf8')); if(x.status!=='running'||x.service!=='crypto-ai-holdco-neon-runtime') process.exit(1); console.log('Application handler routing: PASS')"
          curl --fail --silent --show-error "$FUNCTION_URL/readyz" -o /tmp/ready.json
          cat /tmp/ready.json
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('/tmp/ready.json','utf8')); if(x.status!=='alive'||x.database!=='connected'||x.database_role!=='crypto_holdco_function'||Number(x.runtime_schema_tables)<4||x.governor_state!=='PAUSE_DEGRADED'||x.work_allowed!==false) process.exit(1); console.log('Neon Function readiness + DB + schema + least-privilege role + fail-closed Governor: PASS ('+x.database_role+', '+x.governor_state+', work_allowed='+x.work_allowed+')')"
          curl --fail --silent --show-error "$FUNCTION_URL/.well-known/agent.json" -o /tmp/agent.json
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('/tmp/agent.json','utf8')); if(!Array.isArray(x.skills)||x.skills.length!==7) process.exit(1); console.log('A2A agent card: PASS ('+x.skills.length+' specialist roles)')"
          status="$(curl --silent --output /tmp/unauth-metrics.json --write-out '%{http_code}' "$FUNCTION_URL/v1/metrics")"
          test "$status" = "401"
          echo "Unauthenticated metrics: DENIED (401)"

          status="$(curl --silent --output /tmp/unauth-tasks.json --write-out '%{http_code}' -X POST "$FUNCTION_URL/v1/tasks")"
          test "$status" = "401"
          echo "Unauthenticated task submission: DENIED (401)"

          status="$(curl --silent --output /tmp/unauth-a2a.json --write-out '%{http_code}' -X POST "$FUNCTION_URL/a2a/v1/messages")"
          test "$status" = "401"
          echo "Unauthenticated A2A message: DENIED (401)"

          status="$(curl --silent --output /tmp/unauth-cron.json --write-out '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Neon-Trigger-Invocation-Id: forged-internet-client' \
            --data '{"version":1,"invocation_id":"forged-internet-client","trigger":{"type":"schedule","id":"trigger-3b855bc5-fb48-4547-a84d-b374e56ebb71","name":"forged"},"data":{"scheduled_at":"2026-11-27T00:00:00Z"}}' \
            "$FUNCTION_URL/internal/dispatch")"
          test "$status" = "401"
          echo "Forged public Neon trigger request: DENIED (401)"
